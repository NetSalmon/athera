[package]
name = "athera"
version = "0.1.0"
edition = "2024"
authors = ["Netsalmon <netsalmon@disroot.org>"]
description = "A simple operating system"
license = "GPL-3.0-or-later"
build = "build.rs"

[[bin]]
name = "athera"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
paste = "1.0.15"
fdt = "0.1.5"
thiserror = { version = "2.0.19", default-features = false }
athera-bitmap = { path = "crates/athera-bitmap" }
athera-macros = { path = "crates/athera-macros" }
athera-id-alloc = { path = "crates/athera-id-alloc" }
athera-rand = { path = "crates/athera-rand" }
athera-trie = { path = "crates/athera-trie" }

[build-dependencies]
toml = "1.1.2"
chrono = "0.4.45"

[workspace]
resolver = "2"
members = [
    "athera-userland",
    "crates/*",
]

[features]
halt_directly = []
smp = []
