[package]
name = "athera"
version = "0.1.0"
edition = "2024"
authors = ["Netsalmon <netsalmon@disroot.org>"]
description = "A simple operating system"
license = "GPL-3"
build = "build.rs"


[[bin]]
name = "athera"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
paste = "1.0.15"
fdt = "0.1.5"
athera-const = { path = "athera-const" }
athera-id-alloc = { path = "athera-id-alloc" }

[build-dependencies]
toml = "1.1.2"
chrono = "0.4.45"

[workspace]
members = [
    "athera-const",
    "athera-const-macros",
    "athera-userland",
    "athera-id-alloc"
]

[features]
halt_directly = []