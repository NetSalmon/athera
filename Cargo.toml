[package]
name = "novus"
version = "0.1.0"
edition = "2024"
authors = ["Netsalmon <netsalmon@disroot.org>"]
description = "A simple operating system"
license = "GPL-3"
build = "build.rs"


[[bin]]
name = "novus"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
paste = "1.0.15"
fdt = "0.1.5"
novus-const = { path = "novus-const" }
novus-id-alloc = { path = "novus-id-alloc" }

[build-dependencies]
toml = "1.1.2"
chrono = "0.4.45"

[workspace]
members = [
    "novus-const",
    "novus-const-macros",
    "novus-userland",
    "novus-id-alloc"
]
