[package]
name = "novus"
version = "0.1.0"
edition = "2024"
authors = ["Netsalmon <netsalmon@disroot.org>"]
description = "A simple operating system"
license = "GPL-3"
build = "build.rs"


[[bin]]
name = "novus"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
paste = "1.0.15"
fdt = "0.1.5"
const-num = { path = "const-num" }
const-val = { path = "const-val" }

[build-dependencies]
toml = "1.1.2+spec-1.1.0"

[workspace]
members = [
    "const-num",
    "const-val",
    "applications"
]
